name: Release

# Triggers when a release is published via the GitHub UI.
# `push.tags` triggers do not reliably fire for tags created through the UI —
# `release` events do.
on:
  release:
    types: [published]

jobs:
  release:
    name: Attach build asset and CHANGELOG body
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Extract CHANGELOG section for this tag
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "Extracting CHANGELOG section for v$VERSION..."
          awk -v ver="$VERSION" '
            BEGIN { capture = 0 }
            /^## \[/ {
              if (capture) { exit }
              if (index($0, "[" ver "]")) { capture = 1; next }
            }
            capture { print }
          ' CHANGELOG.md > release-body.md
          if [ -s release-body.md ]; then
            echo "::group::Release body"
            cat release-body.md
            echo "::endgroup::"
          else
            echo "No CHANGELOG entry for v$VERSION — body left as-is."
            rm -f release-body.md
          fi

      - name: Upload dist as release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/simple-thermostat.js \
            --repo "${{ github.repository }}" \
            --clobber

      # Only fills in the body when the release was published without one, so a
      # hand-written announcement text survives. `CURRENT_BODY` is passed through
      # `env` on purpose — interpolating it into the script would execute
      # backticks or $(…) contained in the release text.
      - name: Update release body from CHANGELOG (only if empty)
        if: hashFiles('release-body.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_BODY: ${{ github.event.release.body }}
        run: |
          if [ -n "$(printf '%s' "$CURRENT_BODY" | tr -d '[:space:]')" ]; then
            echo "Release already has a body — leaving it untouched."
            exit 0
          fi
          echo "Release body is empty — filling it from the CHANGELOG."
          gh release edit "${{ github.event.release.tag_name }}" \
            --repo "${{ github.repository }}" \
            --notes-file release-body.md
