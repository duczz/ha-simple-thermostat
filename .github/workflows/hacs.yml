name: Validate HACS

on:
  push:
    branches:
      - master

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No build needed: with releases present, HACS validation checks the
      # latest release asset (simple-thermostat.js), not the checkout.
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: plugin
